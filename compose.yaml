services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t _health -m ok -q 0"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:0.6.8
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          echo "Model $$OLLAMA_MODEL is already downloaded"
        else
          ollama pull "$$OLLAMA_MODEL"
        fi
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - data
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HEART_RATE_DB: /data/heart-rate.sqlite3
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ALARM_LOW_BPM: ${ALARM_LOW_BPM:-50}
      ALARM_HIGH_BPM: ${ALARM_HIGH_BPM:-120}
      ALARM_AFTER_SAMPLES: ${ALARM_AFTER_SAMPLES:-15}
      SYNTHETIC_USER_ID: ${SYNTHETIC_USER_ID:-user-0001}
      SAMPLE_RATE_SECONDS: ${SAMPLE_RATE_SECONDS:-1}
    volumes:
      - heart_rate_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - data
      - edge
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  generator:
    build: .
    command: ["python", "-m", "app.generate"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SYNTHETIC_USER_ID: ${SYNTHETIC_USER_ID:-user-0001}
      SAMPLE_RATE_SECONDS: ${SAMPLE_RATE_SECONDS:-1}
      DATA_SEED: ${DATA_SEED:-2025}
    networks:
      - data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  data:
    internal: true
  edge:

volumes:
  heart_rate_data:
  mqtt_data:
  ollama_data:
