services:
  minio:
    image: health-data-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-healthdata-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-root-password}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data
    restart: unless-stopped

  minio-init:
    image: health-data-minio-init:RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: infra/minio-init.Dockerfile
    entrypoint: ["/bin/sh", "/infra/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-healthdata-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-root-password}
      GENERATOR_ACCESS_KEY: ${GENERATOR_ACCESS_KEY:-health-generator}
      GENERATOR_SECRET_KEY: ${GENERATOR_SECRET_KEY:-local-generator-secret}
      ETL_ACCESS_KEY: ${ETL_ACCESS_KEY:-health-etl}
      ETL_SECRET_KEY: ${ETL_SECRET_KEY:-local-etl-secret}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-health-api}
      API_SECRET_KEY: ${API_SECRET_KEY:-local-api-secret}
    volumes:
      - ./infra:/infra:ro
    networks:
      - data
    depends_on:
      - minio
    restart: "no"

  generator:
    build: .
    command: ["python", "-m", "app.generate"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${GENERATOR_ACCESS_KEY:-health-generator}
      S3_SECRET_KEY: ${GENERATOR_SECRET_KEY:-local-generator-secret}
      S3_BUCKET: health-raw
      DATA_SEED: ${DATA_SEED:-2025}
    networks:
      - data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  etl:
    build: .
    command: ["python", "-m", "app.etl"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${ETL_ACCESS_KEY:-health-etl}
      S3_SECRET_KEY: ${ETL_SECRET_KEY:-local-etl-secret}
      RAW_BUCKET: health-raw
      CURATED_BUCKET: health-curated
    networks:
      - data
    depends_on:
      generator:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${API_ACCESS_KEY:-health-api}
      S3_SECRET_KEY: ${API_SECRET_KEY:-local-api-secret}
      CURATED_BUCKET: health-curated
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - data
      - edge
    depends_on:
      etl:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  data:
    internal: true
  edge:

volumes:
  minio_data:
